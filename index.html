<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARKSKYZ Radio — Live</title>
<meta name="description" content="DARKSKYZ Radio — 24/7 hard rock, live now.">
<meta property="og:title" content="DARKSKYZ Radio — Live">
<meta property="og:description" content="24/7 hard rock from Phoenix. Tap to listen live.">
<style>
  :root{
    --bg:#0C0D0F; --panel:#16181C; --line:#2A2D33;
    --ink:#F2EFE9; --muted:#9A9AA2;
    --accent:#E0561B; --accent-hi:#FF6A25;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:420px}

  .live{
    display:inline-flex; align-items:center; gap:8px;
    font:600 12px/1 -apple-system,system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase;
    color:#FF5A4A; margin-bottom:22px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#FF3B2F;box-shadow:0 0 0 0 rgba(255,59,47,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,59,47,0)}100%{box-shadow:0 0 0 0 rgba(255,59,47,0)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  h1{margin:0 0 6px; font-size:34px; line-height:1.05; font-weight:800; letter-spacing:.02em; text-transform:uppercase}
  .sub{margin:0 0 28px; color:var(--muted); font-size:15px}

  .btn{
    display:block; width:100%; padding:19px 20px; margin:0 0 11px;
    background:var(--accent); color:#fff; text-decoration:none;
    border-radius:14px; font-size:17px; font-weight:700; letter-spacing:.01em;
    -webkit-tap-highlight-color:transparent; transition:background .15s, transform .1s;
  }
  .btn:active{background:var(--accent-hi); transform:scale(.985)}
  .btn small{display:block; font-weight:500; font-size:12.5px; opacity:.82; margin-top:3px; letter-spacing:.02em}

  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); font-size:15px; font-weight:600; padding:15px 20px}
  .btn.ghost:active{background:var(--panel); transform:scale(.985)}
  .btn.ghost small{opacity:.7; font-size:12px}

  .tip{
    margin:24px 0 0; padding:14px 16px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px;
    color:var(--muted); font-size:13px; line-height:1.5;
  }
  .tip b{color:var(--ink); font-weight:600}

  #debug{
    margin-top:22px; padding:12px; background:#000; border:1px solid var(--line);
    border-radius:10px; color:#7FD68A; font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;
    text-align:left; word-break:break-all; display:none;
  }
  #debug b{color:#FFD479; font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <div class="live"><span class="dot"></span> Live now</div>

  <h1>DARKSKYZ Radio</h1>
  <p class="sub">24/7 hard rock from Phoenix</p>

  <a class="btn" id="appBtn" href="#">
    Open in YouTube
    <small>Tap here to join the live chat</small>
  </a>

  <a class="btn ghost" id="safariBtn" href="#" style="display:none">
    Open in Safari
    <small>If the button above did nothing</small>
  </a>

  <a class="btn ghost" id="webBtn" href="#">Watch here instead</a>

  <p class="tip">
    <b>No chat?</b> Live chat only works in the YouTube app — use the top button,
    then scroll down under the video.
  </p>

  <div id="debug"></div>

</div>

<script>
(function () {
  /* ==================================================================
     CONFIG

     You normally do NOT edit this file. The video id comes from the URL:

        .../darkskyz/?v=VIDEOID     <- strongest link. Opens the app
                                       straight into that stream, chat and all.
        .../darkskyz/               <- no id. Falls back to the channel's
                                       /live page. Use this for your bio.

     Grab the id from the live stream's URL: the 11 characters after
     "watch?v=".  It changes every time a block restarts, so use ?v= for
     a push you are posting now, and the bare URL for anything permanent.
     ================================================================== */

  var HANDLE       = 'darkskyz66';
  var CHANNEL_ID   = 'UCnopZVhftJEs8pHa_vpGFDw';  // used only as a last resort on iOS
  var DEFAULT_VIDEO = '';                          // optional hardcoded fallback id

  /* ================================================================== */

  // ---- Which video are we sending people to? -----------------------------
  var qs = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (pair) {
    if (!pair) return;
    var kv = pair.split('=');
    qs[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
  });

  var VIDEO_ID = (qs.v || DEFAULT_VIDEO || '').trim();
  if (!/^[A-Za-z0-9_-]{11}$/.test(VIDEO_ID)) VIDEO_ID = '';   // ignore anything malformed

  var WEB = VIDEO_ID
    ? 'https://www.youtube.com/watch?v=' + VIDEO_ID
    : 'https://www.youtube.com/@' + HANDLE + '/live';

  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && typeof document.ontouchend !== 'undefined');
  var isAndroid = /Android/.test(ua);

  // ---- Build the app link ------------------------------------------------
  // iOS: "youtube://watch?v=ID" is the form the app has honored for years and
  // is by far the most dependable. "channel/UC..." is hit and miss, so it is
  // only a last resort when we have no video id at all.
  var APP_URL = '', strong = false;
  if (isIOS) {
    if (VIDEO_ID)        { APP_URL = 'youtube://watch?v=' + VIDEO_ID; strong = true; }
    else if (CHANNEL_ID) { APP_URL = 'youtube://channel/' + CHANNEL_ID; }
  } else if (isAndroid) {
    var path = VIDEO_ID
      ? 'www.youtube.com/watch?v=' + VIDEO_ID
      : 'www.youtube.com/@' + HANDLE + '/live';
    APP_URL = 'intent://' + path + '#Intent;scheme=https;package=com.google.android.youtube;end';
    strong = true;
  }

  var appBtn    = document.getElementById('appBtn');
  var safariBtn = document.getElementById('safariBtn');
  var webBtn    = document.getElementById('webBtn');

  webBtn.setAttribute('href', WEB);
  appBtn.setAttribute('href', APP_URL || WEB);

  /* The in-app-browser escape hatch. "x-safari-https://..." hands the URL to
     Safari itself, which then honors YouTube's universal link and opens the
     app. This is the reliable way out of TikTok's webview on iPhone. */
  if (isIOS) {
    safariBtn.setAttribute('href', 'x-safari-' + WEB);
    safariBtn.style.display = 'block';
  }

  // Desktop: nothing to deep link, one button straight to the web.
  if (!APP_URL) {
    appBtn.innerHTML = 'Watch DARKSKYZ Radio<small>Opens youtube.com</small>';
    webBtn.style.display = 'none';
  }

  /* ---- Fallback ---------------------------------------------------------
     If the app takes the link, this page goes into the background. So when the
     timer fires we simply ask whether the page is still on screen. If it is,
     nothing opened — send them to the web player rather than a dead end. */
  var timer = null;

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && timer) { clearTimeout(timer); timer = null; }
  });
  window.addEventListener('pagehide', function () {
    if (timer) { clearTimeout(timer); timer = null; }
  });

  function go(e) {
    if (e) e.preventDefault();
    if (!APP_URL) { window.location.href = WEB; return; }

    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      if (!document.hidden) window.location.href = WEB;
    }, 1500);

    window.location.href = APP_URL;
  }

  appBtn.addEventListener('click', go);

  /* Auto-attempt only when the link is one we trust. A weak link that fails
     silently just teaches people the page is broken, so we let them tap. */
  if (strong) {
    setTimeout(function () { if (!document.hidden) go(null); }, 300);
  }

  /* ---- Diagnostics: add &debug=1 (or ?debug=1) --------------------------- */
  if (qs.debug === '1') {
    var d = document.getElementById('debug');
    d.style.display = 'block';
    d.innerHTML =
      '<b>platform</b><br>' + (isIOS ? 'iOS' : isAndroid ? 'Android' : 'desktop / other') + '<br><br>' +
      '<b>video id</b><br>' + (VIDEO_ID || '(none - using channel /live)') + '<br><br>' +
      '<b>link strength</b><br>' + (strong ? 'strong - auto-opening' : 'weak - tap only') + '<br><br>' +
      '<b>app link</b><br>' + (APP_URL || '(none)') + '<br><br>' +
      '<b>safari escape</b><br>' + (isIOS ? 'x-safari-' + WEB : '(iOS only)') + '<br><br>' +
      '<b>web link</b><br>' + WEB + '<br><br>' +
      '<b>user agent</b><br>' + ua;
  }
})();
</script>
</body>
</html>
