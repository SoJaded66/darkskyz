<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARKSKYZ Radio — Live</title>
<meta name="description" content="DARKSKYZ Radio — 24/7 hard rock, live now.">
<meta property="og:title" content="DARKSKYZ Radio — Live">
<meta property="og:description" content="24/7 hard rock from Phoenix. Tap to listen live.">
<style>
  :root{
    --bg:#0C0D0F; --panel:#16181C; --line:#2A2D33;
    --ink:#F2EFE9; --muted:#9A9AA2;
    --accent:#E0561B; --accent-hi:#FF6A25;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:420px}

  .live{
    display:inline-flex; align-items:center; gap:8px;
    font:600 12px/1 -apple-system,system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase;
    color:#FF5A4A; margin-bottom:22px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#FF3B2F;box-shadow:0 0 0 0 rgba(255,59,47,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,59,47,0)}100%{box-shadow:0 0 0 0 rgba(255,59,47,0)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  h1{
    margin:0 0 6px; font-size:34px; line-height:1.05; font-weight:800;
    letter-spacing:.02em; text-transform:uppercase;
  }
  .sub{margin:0 0 30px; color:var(--muted); font-size:15px}

  .btn{
    display:block; width:100%; padding:19px 20px; margin:0 0 14px;
    background:var(--accent); color:#fff; text-decoration:none;
    border-radius:14px; font-size:17px; font-weight:700; letter-spacing:.01em;
    -webkit-tap-highlight-color:transparent; transition:background .15s, transform .1s;
  }
  .btn:active{background:var(--accent-hi); transform:scale(.985)}
  .btn small{display:block; font-weight:500; font-size:12.5px; opacity:.82; margin-top:3px; letter-spacing:.02em}

  .alt{
    display:inline-block; color:var(--muted); font-size:14px; text-decoration:none;
    border-bottom:1px solid var(--line); padding-bottom:2px;
  }
  .alt:active{color:var(--ink)}

  .tip{
    margin:30px 0 0; padding:14px 16px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px;
    color:var(--muted); font-size:13px; line-height:1.5;
  }
  .tip b{color:var(--ink); font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <div class="live"><span class="dot"></span> Live now</div>

  <h1>DARKSKYZ Radio</h1>
  <p class="sub">24/7 hard rock from Phoenix</p>

  <a class="btn" id="appBtn" href="#">
    Open in YouTube
    <small>Tap here to join the live chat</small>
  </a>

  <a class="alt" id="webBtn" href="#">or watch in this browser</a>

  <p class="tip">
    <b>Chat not showing?</b> Chat only works in the YouTube app — use the button above,
    then scroll down under the video.
  </p>

</div>

<script>
(function () {
  /* ------------------------------------------------------------------
     CONFIG — the only part you edit.
     ------------------------------------------------------------------ */
  var HANDLE   = 'darkskyz66';  // your channel handle, no @
  var VIDEO_ID = '';            // optional: a specific video id (11 chars).
                                // Leave '' to always send people to whatever is live.
                                // A video id is the most reliable form of the iOS
                                // deep link, so use it when promoting one video.
  var AUTO_TRY = true;          // try to jump to the app automatically on load

  /* ------------------------------------------------------------------ */

  var WEB = VIDEO_ID
    ? 'https://www.youtube.com/watch?v=' + VIDEO_ID
    : 'https://www.youtube.com/@' + HANDLE + '/live';

  var PATH = VIDEO_ID
    ? 'www.youtube.com/watch?v=' + VIDEO_ID
    : 'www.youtube.com/@' + HANDLE + '/live';

  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && typeof document.ontouchend !== 'undefined'); // iPadOS
  var isAndroid = /Android/.test(ua);

  // iOS: the YouTube app owns the youtube:// scheme.
  // Android: an intent URL, which webviews hand straight to the OS.
  var APP_URL = isIOS
    ? 'youtube://' + PATH
    : isAndroid
      ? 'intent://' + PATH + '#Intent;scheme=https;package=com.google.android.youtube;end'
      : WEB;

  var appBtn = document.getElementById('appBtn');
  var webBtn = document.getElementById('webBtn');
  appBtn.setAttribute('href', APP_URL);
  webBtn.setAttribute('href', WEB);

  // On desktop there is no app to open — make the main button the web link.
  if (!isIOS && !isAndroid) {
    appBtn.setAttribute('href', WEB);
    appBtn.innerHTML = 'Watch DARKSKYZ Radio<small>Opens youtube.com</small>';
    webBtn.style.display = 'none';
    return;
  }

  /* If the app opens, this page goes into the background. We watch for that
     so the fallback never fires on top of a successful launch — and never
     fires later when the person comes back to this tab. */
  var launched = false, timer = null;
  function cancel() {
    launched = true;
    if (timer) { clearTimeout(timer); timer = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) cancel();
  });
  window.addEventListener('pagehide', cancel);
  window.addEventListener('blur', cancel);

  function go(e) {
    if (e) e.preventDefault();
    window.location.href = APP_URL;
    // No app, or the webview blocked the scheme: land them on the web player
    // rather than an error page.
    timer = setTimeout(function () {
      if (!launched && !document.hidden) window.location.href = WEB;
    }, 1600);
  }

  appBtn.addEventListener('click', go);

  /* Auto-attempt once. Many in-app browsers (TikTok's included) block a
     scheme jump that has no user gesture behind it — that is exactly what
     the button is for, so a blocked auto-try costs nothing. */
  if (AUTO_TRY) {
    setTimeout(function () { if (!launched) go(null); }, 250);
  }
})();
</script>
</body>
</html>
