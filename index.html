<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARKSKYZ Radio — Live</title>
<meta name="description" content="DARKSKYZ Radio — 24/7 hard rock, live now.">
<meta property="og:title" content="DARKSKYZ Radio — Live">
<meta property="og:description" content="24/7 hard rock from Phoenix. Tap to listen live.">
<style>
  :root{
    --bg:#0C0D0F; --panel:#16181C; --line:#2A2D33;
    --ink:#F2EFE9; --muted:#9A9AA2;
    --accent:#E0561B; --accent-hi:#FF6A25;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    text-align:center; -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%; max-width:420px}

  .live{
    display:inline-flex; align-items:center; gap:8px;
    font:600 12px/1 -apple-system,system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase;
    color:#FF5A4A; margin-bottom:22px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#FF3B2F;box-shadow:0 0 0 0 rgba(255,59,47,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,59,47,0)}100%{box-shadow:0 0 0 0 rgba(255,59,47,0)}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  h1{margin:0 0 6px; font-size:34px; line-height:1.05; font-weight:800; letter-spacing:.02em; text-transform:uppercase}
  .sub{margin:0 0 28px; color:var(--muted); font-size:15px}

  .btn{
    display:block; width:100%; padding:19px 20px; margin:0 0 11px;
    background:var(--accent); color:#fff; text-decoration:none;
    border-radius:14px; font-size:17px; font-weight:700; letter-spacing:.01em;
    -webkit-tap-highlight-color:transparent; transition:background .15s, transform .1s;
  }
  .btn:active{background:var(--accent-hi); transform:scale(.985)}
  .btn small{display:block; font-weight:500; font-size:12.5px; opacity:.82; margin-top:3px; letter-spacing:.02em}

  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); font-size:15px; font-weight:600; padding:15px 20px}
  .btn.ghost:active{background:var(--panel); transform:scale(.985)}
  .btn.ghost small{opacity:.65; font-size:12px; font-weight:500}

  .tip{
    margin:24px 0 0; padding:14px 16px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px;
    color:var(--muted); font-size:13px; line-height:1.5;
  }
  .tip b{color:var(--ink); font-weight:600}

  #debug{
    margin-top:22px; padding:12px; background:#000; border:1px solid var(--line);
    border-radius:10px; color:#7FD68A; font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;
    text-align:left; word-break:break-all; display:none;
  }
  #debug b{color:#FFD479; font-weight:600}
  #debug .ok{color:#7FD68A}
  #debug .bad{color:#FF7A6B}
</style>
</head>
<body>
<div class="wrap">

  <div class="live"><span class="dot"></span> Live now</div>

  <h1>DARKSKYZ Radio</h1>
  <p class="sub">24/7 hard rock from Phoenix</p>

  <div id="buttons"></div>

  <p class="tip" id="tip"></p>

  <div id="debug"></div>

</div>

<script>
(function () {
  /* ==================================================================
     CONFIG

     You should not need to edit this file again. The video id rides in
     the URL instead:

        .../darkskyz/?v=VIDEOID    strongest link - opens the app straight
                                   into that stream, with chat
        .../darkskyz/              no id - falls back to the channel's
                                   /live page. Use this one in your bio.

     The id is the 11 characters after "/live/" or "watch?v=" in the
     stream's URL. Drop any "?si=..." on the end - that is share tracking.

     Add &debug=1 to any link to see a diagnostic panel. Debug mode also
     freezes the page so nothing navigates away while you read it.
     ================================================================== */

  var HANDLE        = 'darkskyz66';
  var CHANNEL_ID    = 'UCnopZVhftJEs8pHa_vpGFDw';
  var DEFAULT_VIDEO = '';   // optional: an id to use when the URL has no ?v=

  /* ================================================================== */

  // ---- Parse the query string -------------------------------------------
  var qs = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (pair) {
    if (!pair) return;
    var kv = pair.split('=');
    qs[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
  });
  var DEBUG = qs.debug === '1';

  var VIDEO_ID = (qs.v || DEFAULT_VIDEO || '').trim();
  if (!/^[A-Za-z0-9_-]{11}$/.test(VIDEO_ID)) VIDEO_ID = '';

  var WEB = VIDEO_ID
    ? 'https://www.youtube.com/watch?v=' + VIDEO_ID
    : 'https://www.youtube.com/@' + HANDLE + '/live';

  // ---- Who is looking at this? ------------------------------------------
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (/Macintosh/.test(ua) && typeof document.ontouchend !== 'undefined');
  var isAndroid = /Android/.test(ua);

  // In-app browsers: TikTok, Instagram, Facebook, Snapchat, LinkedIn.
  // These are the ones that swallow custom-scheme links on iPhone.
  var inApp = /musical_ly|Bytedance|TikTok|Instagram|FBAN|FBAV|FB_IAB|Snapchat|LinkedInApp|Line\//i.test(ua);
  // A real iOS browser says "Safari"; most embedded webviews do not.
  if (isIOS && !inApp && !/Safari/.test(ua)) inApp = true;

  // ---- Build the links ---------------------------------------------------
  var APP_URL = '';
  if (isIOS) {
    if (VIDEO_ID)        APP_URL = 'youtube://watch?v=' + VIDEO_ID;
    else if (CHANNEL_ID) APP_URL = 'youtube://channel/' + CHANNEL_ID;
  } else if (isAndroid) {
    var path = VIDEO_ID
      ? 'www.youtube.com/watch?v=' + VIDEO_ID
      : 'www.youtube.com/@' + HANDLE + '/live';
    APP_URL = 'intent://' + path + '#Intent;scheme=https;package=com.google.android.youtube;end';
  }

  // Hands the URL to Safari itself, which then honors YouTube's universal
  // link and opens the app. This is the way out of an in-app browser on iOS.
  var SAFARI_URL = 'x-safari-' + WEB;

  /* ---- Decide what the buttons should be --------------------------------
     Inside TikTok on an iPhone, the scheme jump usually fails, so the Safari
     escape is the button that deserves to be first. Everywhere else the
     direct app link is better. */
  var plan;
  if (isIOS && inApp) {
    plan = {
      mode: 'ios-inapp',
      primary:  { label: 'Open in Safari',  note: 'Then it opens in the YouTube app', href: SAFARI_URL, deep: false },
      second:   { label: 'Try YouTube app', note: 'Direct - may be blocked in here',  href: APP_URL,    deep: true  },
      autoTry:  false,
      tip: '<b>Chat lives in the app.</b> TikTok\'s built-in browser cannot open it — use the top button to jump out to Safari, which hands you to YouTube.'
    };
  } else if (isIOS) {
    plan = {
      mode: 'ios-safari',
      primary:  { label: 'Open in YouTube', note: 'Tap here to join the live chat', href: APP_URL,    deep: true  },
      second:   { label: 'Open in Safari',  note: 'If the button above did nothing', href: SAFARI_URL, deep: false },
      autoTry:  !!VIDEO_ID,
      tip: '<b>No chat?</b> Live chat only works in the YouTube app — use the top button, then scroll down under the video.'
    };
  } else if (isAndroid) {
    plan = {
      mode: 'android',
      primary:  { label: 'Open in YouTube', note: 'Tap here to join the live chat', href: APP_URL, deep: true },
      second:   null,
      autoTry:  true,
      tip: '<b>No chat?</b> Live chat only works in the YouTube app — use the button above, then scroll down under the video.'
    };
  } else {
    plan = {
      mode: 'desktop',
      primary:  { label: 'Watch DARKSKYZ Radio', note: 'Opens youtube.com', href: WEB, deep: false },
      second:   null,
      autoTry:  false,
      tip: '<b>24/7 hard rock.</b> Live chat is on the right of the player once you are on YouTube.'
    };
  }

  // ---- Render ------------------------------------------------------------
  var box = document.getElementById('buttons');
  var html = '';

  html += '<a class="btn" id="primaryBtn" href="' + plan.primary.href + '">' +
          plan.primary.label + '<small>' + plan.primary.note + '</small></a>';

  if (plan.second && plan.second.href) {
    html += '<a class="btn ghost" id="secondBtn" href="' + plan.second.href + '">' +
            plan.second.label + '<small>' + plan.second.note + '</small></a>';
  }

  if (plan.mode !== 'desktop') {
    html += '<a class="btn ghost" id="webBtn" href="' + WEB + '">Watch here instead</a>';
  }

  box.innerHTML = html;
  document.getElementById('tip').innerHTML = plan.tip;

  /* ---- Fallback ---------------------------------------------------------
     When the app takes a deep link this page goes into the background. So at
     the moment the timer fires we just ask: is this page still on screen? If
     it is, nothing opened — send them to the web player instead of a dead
     end. Nothing sticky, nothing that can jam. */
  var timer = null;

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && timer) { clearTimeout(timer); timer = null; }
  });
  window.addEventListener('pagehide', function () {
    if (timer) { clearTimeout(timer); timer = null; }
  });

  function attempt(href) {
    if (DEBUG) return;              // debug mode never navigates on its own
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      timer = null;
      if (!document.hidden) window.location.href = WEB;
    }, 1500);
    window.location.href = href;
  }

  // Only deep links get the fallback treatment. The Safari escape and the
  // plain web link are ordinary navigation — let the browser handle them.
  function wire(id, cfg) {
    var el = document.getElementById(id);
    if (!el || !cfg || !cfg.deep) return;
    el.addEventListener('click', function (e) {
      if (DEBUG) { e.preventDefault(); return; }
      e.preventDefault();
      attempt(cfg.href);
    });
  }
  wire('primaryBtn', plan.primary);
  wire('secondBtn',  plan.second);

  if (plan.autoTry && plan.primary.deep && plan.primary.href && !DEBUG) {
    setTimeout(function () { if (!document.hidden) attempt(plan.primary.href); }, 300);
  }

  // ---- Diagnostics -------------------------------------------------------
  if (DEBUG) {
    function row(label, value, good) {
      var cls = good === undefined ? '' : (good ? 'ok' : 'bad');
      return '<b>' + label + '</b><br><span class="' + cls + '">' + value + '</span><br><br>';
    }
    var d = document.getElementById('debug');
    d.style.display = 'block';
    d.innerHTML =
      row('page frozen', 'debug on - nothing will auto-navigate') +
      row('platform', isIOS ? 'iOS' : isAndroid ? 'Android' : 'desktop / other', isIOS || isAndroid) +
      row('browser', inApp ? 'in-app browser (TikTok/IG/FB)' : 'real browser') +
      row('mode', plan.mode) +
      row('video id', VIDEO_ID || '(none - using channel /live)', !!VIDEO_ID) +
      row('app link', APP_URL || '(none)', !!APP_URL) +
      row('safari escape', isIOS ? SAFARI_URL : '(iOS only)') +
      row('web link', WEB) +
      row('primary button', plan.primary.label + '  ->  ' + plan.primary.href) +
      row('user agent', ua);
  }
})();
</script>
</body>
</html>
